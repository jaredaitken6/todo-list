<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        hardcoded into the html

        - a div that holds the project folders list
    -->
    <!-- 
        dynamically placed into the html via js

        - a list of the project folders
    -->
    <!-- hardcode a sample of project folders to see how it will look -->
     <!-- 
        the list of folders will be in an unordered list and in the unordered list will be list items
       -->
    <main class="todo-projects-page">
        <section class="folder-column">
            <ul id="task-folder-list">
                <li class="todo-project">
                    <button class="todo-project-btn" type="button">
                        <span class="project-name">Default Folder</span>
                    </button>
                    <button class="project-delete-btn" type="button">
                        &times;
                    </button>
                </li>
                <li class="todo-project">
                    <button class="todo-project-btn" type="button">
                        <span class="project-name">Folder 1</span>
                    </button>
                    <button class="project-delete-btn" type="button">
                        &times;
                    </button>
                </li>
                <li class="todo-project">
                    <button class="todo-project-btn" type="button">
                        <span class="project-name">Folder 2</span>
                    </button>
                    <button class="project-delete-btn" type="button">
                        &times;
                    </button>
                </li>
                <li class="todo-project">
                    <button class="todo-project-btn" type="button">
                        <span class="project-name">Folder 3</span>
                    </button>
                    <button class="project-delete-btn" type="button">
                        &times;
                    </button>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
